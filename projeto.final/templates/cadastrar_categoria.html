<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova categoria | IC Agrícola</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">

    <style>
        .formulario-container {
            background: white;
            border-radius: 18px;
            padding: 30px;
            max-width: 700px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #173d29;
        }

        .campo input,
        .campo textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #d8e4dd;
            border-radius: 10px;
            font-family: Poppins, sans-serif;
            font-size: 14px;
            outline: none;
        }

        .campo input:focus,
        .campo textarea:focus {
            border-color: #0d4d2c;
        }

        .campo textarea {
            min-height: 120px;
            resize: vertical;
        }

        .botoes-formulario {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .botao-salvar {
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            background: #0d4d2c;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .botao-salvar:hover {
            background: #146c43;
        }

        .botao-cancelar {
            padding: 12px 20px;
            border-radius: 10px;
            background: #e9efeb;
            color: #365343;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <button class="botao-menu" id="botaoMenu">☰</button>

    <aside class="menu-lateral" id="menuLateral">

        <div class="logo-menu">

            <img src="{{ url_for('static', filename='ICBRANCO.png') }}"
                 alt="Logo IC Agrícola">

            <h2>IC Agrícola</h2>

        </div>

        <nav class="links-menu">

            <a href="{{ url_for('dashboard') }}" class="link-menu">
                <span>▣</span>
                Dashboard
            </a>

            <a href="{{ url_for('produtos') }}" class="link-menu">
                <span>▤</span>
                Produtos
            </a>

            <a href="{{ url_for('categorias') }}" class="link-menu ativo">
                <span>▥</span>
                Categorias
            </a>

            <a href="{{ url_for('entrada') }}" class="link-menu">
                <span>↙</span>
                Entrada
            </a>

            <a href="{{ url_for('saida') }}" class="link-menu">
                <span>↗</span>
                Saída
            </a>

            <a href="{{ url_for('movimentacao') }}" class="link-menu">
                <span>↔</span>
                Movimentações
            </a>

            <a href="{{ url_for('notificacoes') }}" class="link-menu">
                <span>🔔</span>
                Notificações
            </a>

        </nav>

        <div class="perfil-menu">

            <button class="botao-perfil" id="botaoPerfil">

                <div class="avatar-perfil">
                    {{ (session.get('usuario') or 'U')[0]|upper }}
                </div>

                <div class="dados-perfil">

                    <strong>
                        {{ session.get('usuario', 'Usuário') }}
                    </strong>

                    <small>Meu perfil</small>

                </div>

                <span class="seta-perfil">⌃</span>

            </button>

            <div class="opcoes-perfil" id="opcoesPerfil">

                <a href="{{ url_for('perfil') }}"
                   class="opcao-perfil">

                    <span>👤</span>
                    Editar perfil

                </a>

                <button type="button"
                        class="opcao-perfil"
                        id="botaoAcessibilidade">

                    <span>⚙</span>
                    Acessibilidade

                </button>

                <a href="{{ url_for('logout') }}"
                   class="opcao-perfil sair">

                    <span>↪</span>
                    Sair

                </a>

            </div>

        </div>

    </aside>


    <main class="conteudo-principal">

        <header class="cabecalho">

            <div>

                <p class="texto-pequeno">
                    Organização do estoque
                </p>

                <h1>Nova categoria</h1>

                <p class="subtitulo">
                    Cadastre uma nova categoria para seus produtos.
                </p>

            </div>

        </header>


        <section class="area-conteudo">

            <div class="formulario-container">

                <form method="POST">

                    <div class="campo">

                        <label for="nome">
                            Nome da categoria
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Ex.: Peças, Pneus, Máquinas..."
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="descricao">
                            Descrição
                        </label>

                        <textarea
                            id="descricao"
                            name="descricao"
                            placeholder="Digite uma descrição para a categoria..."
                        ></textarea>

                    </div>


                    <div class="botoes-formulario">

                        <button
                            type="submit"
                            class="botao-salvar">

                            Salvar categoria

                        </button>

                        <a
                            href="{{ url_for('categorias') }}"
                            class="botao-cancelar">

                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <script>

        const botaoMenu =
            document.getElementById("botaoMenu");

        const menuLateral =
            document.getElementById("menuLateral");

        botaoMenu.addEventListener("click", function () {

            menuLateral.classList.toggle("aberto");

        });


        const botaoPerfil =
            document.getElementById("botaoPerfil");

        const opcoesPerfil =
            document.getElementById("opcoesPerfil");

        botaoPerfil.addEventListener("click", function () {

            opcoesPerfil.classList.toggle("aberto");

        });

    </script>

</body>
</html>
